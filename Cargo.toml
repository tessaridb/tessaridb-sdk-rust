[package]
name = "tessaridb-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Async client for TessariDB"
repository = "https://github.com/tessaridb/tessaridb-sdk-rust"

[dependencies]
# The runtime is a declared dependency, not an incidental one (ADR-SDK-0003).
# `io-util` for the read/write halves, `net` for TcpStream, `macros`+`rt` so a
# caller that has no runtime of its own can still be handed one in tests, and
# `time` for the pause between retry attempts.
#
# `time` was missing here until 2026-09-01 although the retry loop had used
# `tokio::time::sleep` since it was written, and the whole gate set walked past
# it: `cargo test` and `cargo clippy --all-targets` both unify the
# dev-dependency's features into the library build, so both compiled a `tokio`
# that had `time` for reasons nothing in this section supplied. Only a plain
# `cargo build` sees the library as a consumer would.
tokio = { version = "1", default-features = false, features = [
    "io-util",
    "net",
    "rt",
    "macros",
    "time",
] }
thiserror = "2"
# Most of the node's HTTP surface answers `application/json`, and its strings
# carry arbitrary user text through its own escaping writer — a namespace named
# with a quote arrives as `\"`. That is the difference from the HTTP framing,
# which is a closed grammar this crate writes for itself: JSON here is open, so
# hand-reading it is correct against every shape measured today and silently
# wrong on the first apostrophe in a bucket name.
#
# Taken as a value tree only: no `Deserialize` impls and no `serde_derive`, so
# this brings a reader and not a derive (ADR-SDK-0004). Measured tree: serde_json
# pulls serde_core, itoa, memchr and zmij, none of them proc-macro.
serde_json = "1"

[dev-dependencies]
# `sync` is here and deliberately not above: the real-node tests serialise the
# window between asking the OS for a free port and the child binding it, and an
# async mutex is what holds that window open across the wait. A development
# dependency does not reach anyone who depends on this crate.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "net",
    "time",
    "sync",
] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A client parses bytes from a stranger. These three are the lints that catch the
# ways that goes wrong, and they are denied rather than warned.
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
arithmetic_side_effects = "deny"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
